name: Actualizar datos mensuales

on:
  push:
    branches:
      - main
    paths:
      - "data/source/monthly/*.csv"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-datos-mensuales-${{ github.ref }}
  cancel-in-progress: false

jobs:
  procesar:
    name: Procesar y validar CSV
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - name: Instalar dependencias
        run: python -m pip install -r tools/requirements.txt

      - name: Regenerar datos desde los CSV
        run: python tools/process_monthly_data.py

      - name: Validar actualización mensual
        run: python tools/validate_monthly_update.py

      - name: Guardar archivos regenerados
        run: |
          git add -A -- \
            data/manifest-data.json \
            data/chunks \
            data/audit \
            docs/file-audit.json

          if git diff --cached --quiet; then
            echo "No hay archivos regenerados por guardar."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Actualizar datos mensuales [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
